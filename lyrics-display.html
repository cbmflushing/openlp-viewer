<!--
  CBM Lyrics Display
  Single-page display for projecting bilingual (English/Chinese) song lyrics during worship.
  Refreshes on OpenLP state notifications and polls every second as a fallback.
  English lines are shown in white, Chinese lines in yellow, on a green background by default.
  All colors, fonts, server IP, and CCLI number are configurable via a settings modal and
  persisted in localStorage. Press '.' to toggle a blackout screen.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBM Lyrics Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            background-color: var(--bg-color, #006400);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
        }
        
        #fade-overlay {
            position: fixed;
            inset: 0;
            background: black;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            transition: opacity 0.3s ease;
        }

        #fade-overlay.dark {
            opacity: 1;
        }

        #content {
            text-align: center;
            padding: 30px 20px;
            max-width: 95%;
            min-height: 50vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        body.auto-fit #content {
            position: fixed;
            left: 2.5%;
            width: 95%;
            max-width: none;
            min-height: 0;
            padding: 0 20px;
        }

        body.auto-fit #content p {
            white-space: nowrap;
        }

        #content p {
            margin: 0;
            line-height: 1.3;
        }
        
        .english {
            color: var(--english-color, white);
            font-size: var(--fit-english, clamp(20px, 4vw, 56px));
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-family: var(--english-font, "Segoe UI", Arial, sans-serif);
        }
        
        .english sup {
            font-size: 0.6em;
            vertical-align: super;
        }
        
        .english em {
            font-style: italic;
        }
        
        .chinese {
            color: var(--chinese-color, #FFFF00);
            font-size: var(--fit-chinese, clamp(24px, 5vw, 64px));
            font-family: var(--chinese-font, "Microsoft YaHei", "SimHei", "PingFang SC", Arial, sans-serif);
            margin-bottom: 8px;
        }
        
        #footer {
            position: fixed;
            bottom: 15px;
            left: 20px;
            color: var(--footer-color, rgba(255,255,255,0.7));
            font-size: 14px;
            line-height: 1.4;
        }
        
        #title-display {
            position: fixed;
            top: 15px;
            left: 20px;
            color: var(--footer-color, rgba(255,255,255,0.7));
            font-size: 14px;
            opacity: 0.7;
        }
        
        #error {
            color: #ff6b6b;
            font-size: 18px;
            display: none;
            text-align: center;
        }
        
        #settings-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        #settings-btn:hover {
            opacity: 1;
            background: rgba(255,255,255,0.25);
        }
        
        body:hover #settings-btn {
            opacity: 0.7;
        }
        
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        #modal {
            background: #1e1e1e;
            color: #e0e0e0;
            padding: 30px;
            border-radius: 12px;
            max-width: 450px;
            max-height: 95vh;
            overflow-y: auto;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        
        #modal h2 {
            margin-bottom: 20px;
            font-size: 22px;
            color: #fff;
        }
        
        #modal p {
            margin-bottom: 15px;
            line-height: 1.5;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #aaa;
        }
        
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            font-size: 14px;
        }
        
        .form-group input[type="text"],
        .form-group input[type="color"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            font-size: 14px;
        }
        
        .form-group input[type="color"] {
            height: 40px;
            padding: 4px;
            cursor: pointer;
        }
        
        .color-row { flex-direction: column; gap: 0 !important; }
        .color-setting { min-width: 0; position: relative; display: grid; grid-template-columns: 70px minmax(0, 1fr); align-items: start; }
        .color-setting > label { margin: 6px 0 0; }
        .color-swatches { display: flex; flex-wrap: wrap; gap: 3px; padding-right: 72px; }
        .color-setting details { grid-column: 1 / -1; }
        .color-setting summary { position: absolute; right: 0; top: 0; }
        .color-current { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
        .color-swatch { width: 22px; height: 24px; border: 1px solid #999; border-radius: 5px; cursor: pointer; padding: 0; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; }
        .color-swatch[aria-pressed="true"]::after { content: "✓"; font-weight: bold; font-size: 18px; }
        #modal :focus-visible { outline: 3px solid #a5b4fc; outline-offset: 2px; }
        .color-current, .color-error { font-size: 12px; margin: 6px 0; overflow-wrap: anywhere; }
        .color-error { color: #ff9b9b; }
        .color-setting summary { cursor: pointer; font-size: 12px; margin: 5px 0; }
        .color-setting details label { margin-top: 8px; }
        .color-setting .color-rgb-row { display: flex; gap: 5px; }
        .color-setting .color-rgb-row label { flex: 1; min-width: 0; }
        .color-setting input[aria-invalid="true"] { border: 2px solid #ff7777; }
        @media (max-width: 480px) {
            .color-swatches { padding-right: 0; }
            .color-setting summary { position: static; }
        }

        .form-row {
            display: flex;
            gap: 15px;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        #modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        #modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        #save-btn {
            background: #4CAF50;
            color: white;
        }
        
        #save-btn:hover {
            background: #45a049;
        }
        
        #reset-btn {
            background: #d32f2f;
            color: white;
        }
        
        #reset-btn:hover {
            background: #b71c1c;
        }
        
        #skip-btn {
            background: #555;
            color: #ccc;
        }
        
        #skip-btn:hover {
            background: #666;
        }
        
        .hidden {
            display: none !important;
        }
        
        body.hidden-content #content,
        body.hidden-content #footer,
        body.hidden-content #error {
            display: none !important;
        }
        
        body.hidden-content {
            background-color: black !important;
        }
        /* '.' keypress toggles hidden-content to blackout the screen */
    </style>
</head>
<body>
    <div id="fade-overlay" class="dark" aria-hidden="true"></div>
    <div id="content"></div>
    <div id="title-display"></div>
    <div id="error">Error fetching data</div>
    <div id="footer">CBM Flushing</div>
    <button id="settings-btn" onclick="showSettings()">&#8942;&#8942;&#8942;</button>
    
    <div id="modal-overlay" class="hidden">
        <div id="modal">
            <h2>CBM Lyrics Display</h2>
            <p>This display fetches lyrics from OpenLP and shows them with English in white and Chinese in yellow on a green background.</p>

            </div>

            <div class="form-row color-row">
                <div class="form-group color-setting" data-color-id="bg-color">
                    <label>Background</label>
                    <div class="color-swatches" role="group" aria-label="Background color presets">

                        <button type="button" class="color-swatch" data-color="#f08c00" style="background:#f08c00" aria-label="Background preset #f08c00" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#ffff00" style="background:#ffff00" aria-label="Background preset #ffff00" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#006400" style="background:#006400" aria-label="Background preset #006400" aria-pressed="false"></button>

                        <button type="button" class="color-swatch" data-color="#1971c2" style="background:#1971c2" aria-label="Background preset #1971c2" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#9c36b5" style="background:#9c36b5" aria-label="Background preset #9c36b5" aria-pressed="false"></button>
                    </div>

                            <label>Green<input class="color-rgb" type="text" inputmode="numeric" aria-label="Background Green" autocomplete="off"></label>

                </div>
                <div class="form-group color-setting" data-color-id="english-color">
                    <label>English</label>
                    <div class="color-swatches" role="group" aria-label="English color presets">
                        <button type="button" class="color-swatch" data-color="#1e1e1e" style="background:#1e1e1e" aria-label="English preset #1e1e1e" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#ffffff" style="background:#ffffff" aria-label="English preset #ffffff" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#e03131" style="background:#e03131" aria-label="English preset #e03131" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#f08c00" style="background:#f08c00" aria-label="English preset #f08c00" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#ffff00" style="background:#ffff00" aria-label="English preset #ffff00" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#006400" style="background:#006400" aria-label="English preset #006400" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#2f9e44" style="background:#2f9e44" aria-label="English preset #2f9e44" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#1971c2" style="background:#1971c2" aria-label="English preset #1971c2" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#9c36b5" style="background:#9c36b5" aria-label="English preset #9c36b5" aria-pressed="false"></button>
                    </div>
                    <div class="color-current" aria-live="polite"></div>
                    <details><summary aria-label="Advanced English color">Advanced</summary>
                        <label for="english-color">Custom color picker</label>
                        <input type="color" id="english-color" value="#ffffff">
                        <label>HEX<input class="color-hex" type="text" aria-label="English HEX" autocomplete="off" spellcheck="false"></label>
                        <div class="color-rgb-row">

            </div>
            
            <div class="form-row color-row">
                <div class="form-group color-setting" data-color-id="chinese-color">
                    <label>Chinese</label>
                    <div class="color-swatches" role="group" aria-label="Chinese color presets">
                        <button type="button" class="color-swatch" data-color="#1e1e1e" style="background:#1e1e1e" aria-label="Chinese preset #1e1e1e" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#ffffff" style="background:#ffffff" aria-label="Chinese preset #ffffff" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#e03131" style="background:#e03131" aria-label="Chinese preset #e03131" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#f08c00" style="background:#f08c00" aria-label="Chinese preset #f08c00" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#ffff00" style="background:#ffff00" aria-label="Chinese preset #ffff00" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#006400" style="background:#006400" aria-label="Chinese preset #006400" aria-pressed="false"></button>

                    </details>
                </div>
                <div class="form-group color-setting" data-color-id="footer-color">
                    <label>Footer</label>
                    <div class="color-swatches" role="group" aria-label="Footer color presets">
                        <button type="button" class="color-swatch" data-color="#1e1e1e" style="background:#1e1e1e" aria-label="Footer preset #1e1e1e" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#ffffff" style="background:#ffffff" aria-label="Footer preset #ffffff" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#e03131" style="background:#e03131" aria-label="Footer preset #e03131" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#f08c00" style="background:#f08c00" aria-label="Footer preset #f08c00" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#ffff00" style="background:#ffff00" aria-label="Footer preset #ffff00" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#006400" style="background:#006400" aria-label="Footer preset #006400" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#2f9e44" style="background:#2f9e44" aria-label="Footer preset #2f9e44" aria-pressed="false"></button>
                        <button type="button" class="color-swatch" data-color="#1971c2" style="background:#1971c2" aria-label="Footer preset #1971c2" aria-pressed="false"></button>

                        <option value="Verdana, sans-serif">Verdana</option>
                        <option value="Tahoma, sans-serif">Tahoma</option>

                    <select id="chinese-font">
                        <option value="&quot;Microsoft YaHei&quot;, &quot;SimHei&quot;, Arial, sans-serif">Microsoft YaHei</option>

                        <option value="&quot;SimSun&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif">SimSun</option>
                        <option value="&quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif">Noto Sans SC</option>
                        <option value="&quot;Microsoft JhengHei&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif">Microsoft JhengHei</option>

    <script>
        // Fallback values used on first run or if localStorage is corrupt
        const DEFAULT_SETTINGS = {
            serverIp: 'localhost:4316',
            displayLanguage: 'bilingual',
            bgColor: '#006400',
            englishColor: '#ffffff',
            chineseColor: '#ffff00',
            footerColor: '#ffffff',
            englishFont: 'Arial, sans-serif',
            chineseFont: '"Microsoft YaHei", "SimHei", Arial, sans-serif',
            showTitle: false,
            autoFit: true,
            ccliNumber: '',
            firstRun: true
        };
        
        let settings = { ...DEFAULT_SETTINGS };
        
        // Each editor keeps the native picker as the canonical valid draft value.
        // Invalid text remains visible and blocks Save until corrected or discarded.
        function colorEditors() {
            return document.querySelectorAll ? document.querySelectorAll('.color-setting') : [];
        }
        function syncColorEditor(root) {
            const picker = root.querySelector('input[type="color"]');
            const value = picker.value.toLowerCase();
            root.querySelector('.color-hex').value = value;
            root.querySelectorAll('.color-rgb').forEach((input, i) => {
                input.value = parseInt(value.slice(1 + i * 2, 3 + i * 2), 16);
            });
            root.querySelectorAll('.color-swatch').forEach(button => {
                button.setAttribute('aria-pressed', String(button.dataset.color === value));
            });
            root.querySelector('.color-current').textContent = 'Selected: ' + value;
            root.querySelectorAll('[aria-invalid]').forEach(input => input.removeAttribute('aria-invalid'));
            root.querySelector('.color-error').hidden = true;
        }
        function markColorError(root, inputs, message) {
            inputs.forEach(input => input.setAttribute('aria-invalid', 'true'));
            const error = root.querySelector('.color-error');
            error.textContent = message;
            error.hidden = false;
        }
        function initColorEditors() {
            colorEditors().forEach(root => {
                const picker = root.querySelector('input[type="color"]');
                const hex = root.querySelector('.color-hex');
                const rgb = [...root.querySelectorAll('.color-rgb')];
                root.querySelectorAll('.color-swatch').forEach(button => button.addEventListener('click', () => {
                    picker.value = button.dataset.color;
                    syncColorEditor(root);
                }));
                picker.addEventListener('input', () => syncColorEditor(root));
                hex.addEventListener('input', () => {
                    if (!/^#[0-9a-f]{6}$/i.test(hex.value)) {
                        markColorError(root, [hex], 'Enter a HEX color as # followed by six hexadecimal digits.');
                        return;
                    }
                    picker.value = hex.value;
                    syncColorEditor(root);
                });
                rgb.forEach(input => input.addEventListener('input', () => {
                    const invalid = rgb.filter(field => !/^\d{1,3}$/.test(field.value) || Number(field.value) > 255);
                    rgb.forEach(field => field.removeAttribute('aria-invalid'));
                    if (invalid.length) {
                        markColorError(root, invalid, 'Enter whole RGB values from 0 to 255.');
                        return;
                    }
                    picker.value = '#' + rgb.map(field => Number(field.value).toString(16).padStart(2, '0')).join('');
                    syncColorEditor(root);
                }));
                syncColorEditor(root);
            });
        }
        function validColorEditors() {
            for (const root of colorEditors()) {
                const invalid = root.querySelector('[aria-invalid="true"]');
                if (invalid) {
                    root.querySelector('details').open = true;
                    invalid.focus();
                    return false;
                }
            }
            return true;
        }

        function loadSettings() {
            const saved = localStorage.getItem('cbmDisplaySettings');
            if (saved) {
                try {
                    settings = { ...DEFAULT_SETTINGS, ...JSON.parse(saved) };
                } catch (e) {
                    settings = { ...DEFAULT_SETTINGS };
                }
            }
            applySettings();
        }
        
        function saveSettings() {
            const previousServer = settings.serverIp;
            settings.serverIp = document.getElementById('server-ip').value.trim() || 'localhost:4316';
            settings.displayLanguage = document.getElementById('display-language').value;
            settings.bgColor = document.getElementById('bg-color').value;
            settings.englishColor = document.getElementById('english-color').value;
            settings.chineseColor = document.getElementById('chinese-color').value;
            settings.footerColor = document.getElementById('footer-color').value;
            settings.englishFont = document.getElementById('english-font').value;
            settings.chineseFont = document.getElementById('chinese-font').value;
            settings.showTitle = document.getElementById('show-title').checked;
            settings.autoFit = document.getElementById('auto-fit').checked;
            settings.ccliNumber = document.getElementById('ccli-number').value.trim();
            settings.firstRun = false;
            
            localStorage.setItem('cbmDisplaySettings', JSON.stringify(settings));
            applySettings();
            if (settings.serverIp !== previousServer) restartConnection();
        }
        
        function applySettings() {
            document.body.style.setProperty('--bg-color', settings.bgColor);
            document.body.style.setProperty('--english-color', settings.englishColor);
            document.body.style.setProperty('--chinese-color', settings.chineseColor);
            document.body.style.setProperty('--footer-color', settings.footerColor);
            document.body.style.setProperty('--english-font', settings.englishFont);
            document.body.style.setProperty('--chinese-font', settings.chineseFont);
            
            document.getElementById('server-ip').value = settings.serverIp;
            document.getElementById('display-language').value = settings.displayLanguage;
            document.getElementById('bg-color').value = settings.bgColor;
            document.getElementById('english-color').value = settings.englishColor;
            document.getElementById('chinese-color').value = settings.chineseColor;
            document.getElementById('footer-color').value = settings.footerColor;
            colorEditors().forEach(syncColorEditor);
            document.getElementById('english-font').value = settings.englishFont;
            document.getElementById('chinese-font').value = settings.chineseFont;
            document.getElementById('show-title').checked = settings.showTitle;
            document.getElementById('auto-fit').checked = settings.autoFit;
            document.getElementById('ccli-number').value = settings.ccliNumber;
            
            document.getElementById('title-display').style.display = settings.showTitle ? 'block' : 'none';
            
            updateFooter();
            fitLyrics();
        }

        // Measure an invisible, unwrapped clone before the browser paints. A binary
        // search handles fixed letter spacing and superscripts as well as font metrics.
        function fitLyrics() {
            const content = document.getElementById('content');
            document.body.classList.toggle('auto-fit', settings.autoFit);
            if (!settings.autoFit) {
                content.style.top = content.style.height = '';
                content.style.removeProperty('--fit-english');
                content.style.removeProperty('--fit-chinese');
                return;
            }
            if (typeof window === 'undefined' || !content.children.length ||
                document.body.classList.contains('hidden-content')) return;
            const title = document.getElementById('title-display');
            const footer = document.getElementById('footer');
            const top = settings.showTitle && title.textContent ? title.getBoundingClientRect().bottom + 15 : 30;
            const bottom = footer.getBoundingClientRect().top - 15;
            const height = Math.max(0, bottom - top);
            const width = Math.max(0, window.innerWidth * 0.95 - 40);
            content.style.top = top + 'px';
            content.style.height = height + 'px';

            const probe = content.cloneNode(true);
            probe.removeAttribute('id');
            probe.style.cssText = 'position:fixed;left:-100000px;top:0;width:max-content;max-width:none;min-height:0;height:auto;padding:0;visibility:hidden;display:block;text-align:center';
            probe.querySelectorAll('p').forEach(p => { p.style.whiteSpace = 'nowrap'; p.style.lineHeight = '1.3'; p.style.margin = '0'; });
            document.body.appendChild(probe);
            // Preserve the original responsive English/Chinese size ratio.
            const en = Math.max(20, Math.min(window.innerWidth * 0.04, 56));
            const zh = Math.max(24, Math.min(window.innerWidth * 0.05, 64));
            const fits = size => {
                probe.querySelectorAll('.english').forEach(p => { p.style.fontSize = size + 'px'; });
                probe.querySelectorAll('.chinese').forEach(p => { p.style.fontSize = size * zh / en + 'px'; });
                const rect = probe.getBoundingClientRect();
                return rect.width <= width && rect.height <= height;
            };
            let low = 0, high = Math.max(window.innerWidth, window.innerHeight) * 2;
            while (high - low > 0.05) {
                const mid = (low + high) / 2;
                if (fits(mid)) low = mid; else high = mid;
            }
            probe.remove();
            content.style.setProperty('--fit-english', low + 'px');
            content.style.setProperty('--fit-chinese', (low * zh / en) + 'px');
        }

        function updateFooter(ccliOverride) {
            let ccliNum = ccliOverride !== undefined ? ccliOverride : settings.ccliNumber;
            let footerHtml = 'CBM Flushing';
            if (ccliNum) {
                footerHtml += ' © CCLI# ' + ccliNum;
            }
            document.getElementById('footer').innerHTML = footerHtml;
        }
        
        function resetSettings() {
            settings = { ...DEFAULT_SETTINGS };
            localStorage.removeItem('cbmDisplaySettings');
            applySettings();
            restartConnection();
            showSettings();
        }
        
        function closeModal(save) {
            if (save && !validColorEditors()) return;
            document.getElementById('modal-overlay').classList.add('hidden');
            settings.firstRun = false;
            localStorage.setItem('cbmDisplaySettings', JSON.stringify(settings));
            if (save) {
                saveSettings();
            }
        }
        
        function showSettings() {
            applySettings();
            document.getElementById('modal-overlay').classList.remove('hidden');
        }
        
        function parseSlideLines(text) {
            const englishLines = [];
            const chineseLines = new Set();
            const decoder = document.createElement('div');
            for (const line of text.replace(/<br\s*\/?>/gi, '\n').split('\n')) {
                decoder.innerHTML = line;
                const visible = decoder.textContent.replace(/\s+/g, '');
                if (!visible) continue;
                const characters = Array.from(visible);
                const chineseCount = characters.filter(char =>
                    /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/u.test(char)
                ).length;
                if (chineseCount / characters.length > 0.3) {
                    chineseLines.add(visible);
                } else {
                    englishLines.push(line.trim());
                }
            }
            return { englishLines, chineseLines: Array.from(chineseLines) };
        }

        function setFadeState(empty) {
            document.getElementById('fade-overlay').classList.toggle('dark', empty);
        }

        let renderedLyrics = null;
        function clearSlide() {
            renderedLyrics = null;
            document.getElementById('content').innerHTML = '';
            document.getElementById('title-display').textContent = '';
            document.getElementById('error').style.display = 'none';
            updateFooter();
            setFadeState(true);
        }

        // Fetches the current live slide from OpenLP and updates the display.
        // Classify visible characters, not formatting spans, to identify Chinese.
        // Song titles matching c### / h### / ch### are decoded as Chorus / Hymnary / Songbook.
        let responseVersion = 0;
        const requestTimeoutMs = 5000;

        // Race the entire response, including JSON parsing: abort alone cannot
        // guarantee a stalled request settles, especially on older browsers.
        function requestJson(url) {
            const controller = typeof AbortController === 'undefined' ? null : new AbortController();
            let cancel;
            let timer;
            const timeout = new Promise((resolve, reject) => {
                cancel = () => {
                    if (controller) controller.abort();
                    reject(new Error('Request timed out or cancelled'));
                };
                timer = setTimeout(cancel, requestTimeoutMs);
            });
            const request = (async () => {
                const response = await fetch(url, controller ? { signal: controller.signal } : undefined);
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })();
            return { promise: Promise.race([request, timeout]).finally(() => clearTimeout(timer)), cancel };
        }

        async function fetchAndDisplay() {
            const version = ++responseVersion;
            try {
                const url = `http://${settings.serverIp}/api/controller/live/text`;
                const data = await requestJson(url).promise;
                if (version !== responseVersion) return;
                
                if (!data.results || !Array.isArray(data.results.slides)) {
                    clearSlide();
                    return;
                }
                
                const slides = data.results.slides;
                let currentSlide = null;
                let songTitle = '';
                
                for (const slide of slides) {
                    if (slide.selected) {
                        currentSlide = slide;
                        songTitle = slide.title || '';
                        break;
                    }
                }
                
                const { englishLines, chineseLines: parsedChineseLines } = parseSlideLines(
                    currentSlide ? (currentSlide.html || currentSlide.text || '') : ''
                );
                const chineseLines = settings.displayLanguage === 'english' ? [] : parsedChineseLines;
                if (!englishLines.length && !chineseLines.length) {
                    clearSlide();
                    return;
                }
                
                document.getElementById('title-display').textContent = settings.showTitle ? songTitle : '';
                
                let footerExtra = '';
                if (songTitle) {
                    const titleLower = songTitle.toLowerCase().trim();
                    const match = titleLower.match(/^([a-z]+)(\d+)/);
                    if (match) {
                        const prefix = match[1];
                        const number = match[2];
                        if (prefix === 'c') {
                            footerExtra = '<br>Chorus #' + number;
                        } else if (prefix === 'h') {
                            footerExtra = '<br>Hymnary #' + number;
                        } else if (prefix === 'ch') {
                            footerExtra = '<br>Songbook #' + number;
                        }
                    }
                }
                
                let footerHtml = 'CBM Flushing';
                if (settings.ccliNumber) {
                    footerHtml += ' © CCLI# ' + settings.ccliNumber;
                }
                footerHtml += footerExtra;
                document.getElementById('footer').innerHTML = footerHtml;
                
                let htmlContent = '';
                
                for (const line of englishLines) {
                    let processed = line
                        .replace(/\s+/g, ' ')
                        .replace(/<sup>(.*?)<\/sup>/gi, '<sup>$1</sup>')
                        .replace(/<em>(.*?)<\/em>/gi, '<em>$1</em>')
                        .trim();
                    if (processed) {
                        htmlContent += `<p class="english">${processed}</p>`;
                    }
                }
                
                for (const line of chineseLines) {
                    let processed = line.replace(/\s+/g, '').trim();
                    if (processed) {
                        htmlContent += `<p class="chinese">${escapeHtml(processed)}</p>`;
                    }
                }
                
                const content = document.getElementById('content');
                if (renderedLyrics !== htmlContent) {
                    content.innerHTML = htmlContent;
                    renderedLyrics = htmlContent;
                    fitLyrics();
                } else if (settings.autoFit && typeof window !== 'undefined') {
                    // A changed title/footer can change the available height even
                    // when the lyrics themselves are unchanged.
                    const title = document.getElementById('title-display');
                    const top = settings.showTitle && title.textContent ? title.getBoundingClientRect().bottom + 15 : 30;
                    const height = Math.max(0, document.getElementById('footer').getBoundingClientRect().top - 15 - top);
                    if (content.style.top !== top + 'px' || content.style.height !== height + 'px') fitLyrics();
                }
                document.getElementById('error').style.display = 'none';
                setFadeState(false);
                
            } catch (error) {
                if (version !== responseVersion) return;
                console.error('Error:', error);
                document.getElementById('error').textContent = 'Error: ' + error.message;
                document.getElementById('error').style.display = 'block';
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // At most one refresh per connection generation; changes while it is in
        // flight invalidate its result and schedule one final, up-to-date read.
        let refreshState = { active: false, pending: false };
        function requestRefresh(notification = true) {
            const state = refreshState;
            if (state.active) {
                if (!notification) return;
                state.pending = true;
                ++responseVersion;
                return;
            }
            state.active = true;
            fetchAndDisplay().finally(() => {
                state.active = false;
                if (state === refreshState && state.pending) {
                    state.pending = false;
                    requestRefresh();
                }
            });
        }

        let connectionGeneration = 0;
        let socket = null;
        let discoveryRequest = null;
        let reconnectTimer = null;
        let reconnectDelay = 2000;

        function restartConnection() {
            const generation = ++connectionGeneration;
            ++responseVersion;
            refreshState = { active: false, pending: false };
            if (discoveryRequest) discoveryRequest.cancel();
            discoveryRequest = null;
            if (reconnectTimer !== null) clearTimeout(reconnectTimer);
            reconnectTimer = null;
            if (socket) socket.close();
            socket = null;
            reconnectDelay = 2000;
            requestRefresh();
            if (typeof WebSocket !== 'undefined') discoverAndConnect(generation);
        }

        async function discoverAndConnect(generation) {
            const server = settings.serverIp;
            let port = 4317;
            const request = requestJson(`http://${server}/api/v2/core/system`);
            discoveryRequest = request;
            try {
                const system = await request.promise;
                const discovered = Number(system.websocketPort || system.websocket_port);
                if (Number.isInteger(discovered) && discovered > 0 && discovered <= 65535) port = discovered;
            } catch (error) {
                // Polling continues; try OpenLP's default WebSocket port.
            }
            if (discoveryRequest === request) discoveryRequest = null;
            if (generation !== connectionGeneration) return;
            let ws;
            try {
                const host = new URL(`http://${server}`).hostname;
                ws = new WebSocket(`ws://${host}:${port}/`);
                socket = ws;
            } catch (error) {
                scheduleReconnect(generation);
                return;
            }
            const current = () => generation === connectionGeneration && socket === ws;
            ws.addEventListener('open', () => {
                if (!current()) return;
                reconnectDelay = 2000;
                requestRefresh();
            });
            ws.addEventListener('message', async event => {
                if (!current()) return;
                try {
                    const payload = event.data instanceof Blob ? await event.data.text() : event.data;
                    if (!current() || typeof payload !== 'string') return;
                    const data = JSON.parse(payload);
                    if (data && data.results && typeof data.results.item === 'string') requestRefresh();
                } catch (error) { /* Ignore malformed and unrelated notifications. */ }
            });
            const disconnected = () => {
                if (!current()) return;
                socket = null;
                ws.close();
                scheduleReconnect(generation);
            };
            ws.addEventListener('error', disconnected);
            ws.addEventListener('close', disconnected);
        }

        function scheduleReconnect(generation) {
            if (generation !== connectionGeneration || reconnectTimer !== null) return;
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                if (generation === connectionGeneration) discoverAndConnect(generation);
            }, reconnectDelay);
            reconnectDelay = Math.min(reconnectDelay * 2, 30000);
        }

        initColorEditors();
        loadSettings();
        if (typeof window !== 'undefined') {
            window.addEventListener('resize', fitLyrics);
            if (document.fonts) {
                document.fonts.addEventListener('loadingdone', fitLyrics);
                document.fonts.ready.then(fitLyrics);
            }
        }
        
        document.getElementById('modal-overlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal(false);
        });

        let isHidden = false;
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && !document.getElementById('modal-overlay').classList.contains('hidden')) {
                closeModal(false);
            }
            if (e.key === '.' && !e.target.matches('input')) {
                isHidden = !isHidden;
                document.body.classList.toggle('hidden-content', isHidden);
                if (!isHidden) fitLyrics();
            }
        });
        
        if (settings.firstRun) {
            document.getElementById('modal-overlay').classList.remove('hidden');
        }
        
        restartConnection();
        setInterval(() => requestRefresh(false), 1000);
    </script>
</body>
</html>
